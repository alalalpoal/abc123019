name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

  ios:
    strategy:
      fail-fast: false
      matrix:
        v:
          - name: A
            sdk: 5.10.1
            ref: 7f6c2a75742856de88dad354e576dcff8a28e881
          - name: B
            sdk: 5.11.0
            ref: f8aec5d1f3df76d840dfd2609f02cef30dc6efdf
          - name: C
            sdk: 5.10.1
            ref: ''
          - name: D
            sdk: 5.8.2
            ref: 7f6c2a75742856de88dad354e576dcff8a28e881

    name: iOS ${{ matrix.v.name }} (SDK ${{ matrix.v.sdk }})
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set mod.json to the SDK version being tested
        run: |
          jq --arg v "${{ matrix.v.sdk }}" '.geode = $v' mod.json > mod.tmp
          mv mod.tmp mod.json
          cat mod.json

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          bindings-ref: ${{ matrix.v.ref }}

      - uses: actions/upload-artifact@v4
        with:
          name: iOS-${{ matrix.v.name }}
          path: ${{ steps.build.outputs.build-output }}
