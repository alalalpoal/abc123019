name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

  ios:
    strategy:
      fail-fast: false
      matrix:
        v:
          - name: A
            ref: c7dc01e33a8a1d958fd3dd036bd57a5fb773d20a
          - name: B
            ref: 13436953582c8bfa6d7a91392c9f575d5bafec83
          - name: C
            ref: 988d671cc43f3a676c23f986eefdd42c3506eed0

    name: iOS ${{ matrix.v.name }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          bindings-ref: ${{ matrix.v.ref }}
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - uses: actions/upload-artifact@v4
        with:
          name: iOS-${{ matrix.v.name }}
          path: ${{ steps.build.outputs.build-output }}
