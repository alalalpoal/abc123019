name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

  ios:
    strategy:
      fail-fast: false
      matrix:
        v:
          - name: A
            ref: 4db17920db65b12aaa224a89ffc9464e709ae8aa
          - name: B
            ref: main

    name: iOS ${{ matrix.v.name }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get bindings and fix the FMOD header bug
        run: |
          git clone https://github.com/geode-sdk/bindings "$RUNNER_TEMP/bindings"
          cd "$RUNNER_TEMP/bindings"
          git checkout ${{ matrix.v.ref }}
          for f in bindings/include/Geode/mapping/*.hpp; do
            perl -pi -e 's#<Geode/fmod/fmod\.h>#<Geode/fmod/fmod.hpp>#' "$f"
          done
          grep -l "fmod.hpp" bindings/include/Geode/mapping/*.hpp
          echo "GEODE_BINDINGS_REPO_PATH=$RUNNER_TEMP/bindings" >> "$GITHUB_ENV"

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS

      - uses: actions/upload-artifact@v4
        with:
          name: iOS-${{ matrix.v.name }}
          path: ${{ steps.build.outputs.build-output }}
